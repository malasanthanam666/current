spring.application.name=shippingService
server.port=9292
# ==========================================
# MongoDB Configuration
# ==========================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=order

# ==========================================
# Apache Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Configuration
spring.kafka.consumer.group-id=shipping-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# ErrorHandlingDeserializer & Jackson Delegates
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ==========================================
# Custom Order Event Configuration
# ==========================================
order.event.topicName=shipping-events
management.endpoints.web.base-path=/actuator

# Expose all web endpoints (or specify a comma-separated list like health,info,metrics)
management.endpoints.web.exposure.include=*

# Explicitly enable or disable specific endpoints if required
management.endpoint.health.enabled=true
management.endpoint.metrics.enabled=true